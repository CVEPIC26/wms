<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS - CV Edukasi Pratama Insan Cemerlang</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">WMS</div>
      <nav>
        <ul>
          <li><a href="#/dashboard">Dashboard</a></li>
          <li><a href="#/receiving">Receiving</a></li>
          <li><a href="#/stock">Stock</a></li>
          <li><a href="#/loading">Loading</a></li>
          <li><a href="#/opname">Stock Opname</a></li>
          <li><a href="#/adjustment">Adjustment</a></li>
        </ul>
      </nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">&#9776;</button>
        <span class="app-name">WMS</span>
        <span class="spacer"></span>
        <span class="current-user" id="current-user"></span>
      </header>

      <main class="content">
        <!-- DASHBOARD -->
        <section id="page-dashboard" class="page">
          <h1>Dashboard</h1>
          <div class="cards" id="dashboard-cards"></div>

          <div class="section">
            <h2>Stock Summary</h2>
            <div id="dashboard-stock"></div>
          </div>

          <div class="section">
            <h2>Recent Movement</h2>
            <div id="dashboard-movements"></div>
          </div>
        </section>

        <!-- RECEIVING (konten diisi dinamis oleh js/receiving.js) -->
        <section id="page-receiving" class="page"></section>

        <!-- STOCK (konten diisi dinamis oleh js/stock.js) -->
        <section id="page-stock" class="page"></section>

        <!-- LOADING (konten diisi dinamis oleh js/loading.js) -->
        <section id="page-loading" class="page"></section>

        <!-- STOCK OPNAME (konten diisi dinamis oleh js/opname.js) -->
        <section id="page-opname" class="page"></section>

        <!-- Placeholder modul lain (sedang dibangun) -->
        <section id="page-adjustment" class="page">
          <h1>Adjustment</h1>
          <div class="section"><div class="state">Modul Adjustment sedang dibangun.</div></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/receiving.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/opname.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
