<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17412e">
  <meta name="description" content="WMS - Warehouse Management System CV Edukasi Pratama Insan Cemerlang">
  <title>WMS - CV Edukasi Pratama Insan Cemerlang</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- SPLASH SCREEN -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-logo"><img src="assets/logo.svg" alt="Logo"></div>
    <div class="splash-title">WMS</div>
    <div class="splash-subtitle">Warehouse Management System</div>
    <div class="splash-loader"></div>
  </div>

  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="assets/logo.svg" alt="Logo"></div>
        <div>
          <div class="brand-name">WMS</div>
          <div class="brand-sub">CV Edukasi Pratama Insan Cemerlang</div>
        </div>
      </div>
      <nav id="sidebar-nav" aria-label="Navigasi utama">
        <div class="nav-group">Menu Utama</div>
        <ul>
          <li><a href="#/dashboard" data-route="/dashboard"><span class="nav-ico">&#9632;</span> Home</a></li>
        </ul>
        <div class="nav-group">Operasional</div>
        <ul>
          <li><a href="#/receiving" data-route="/receiving"><span class="nav-ico">&#8615;</span> Receiving</a></li>
          <li><a href="#/loading" data-route="/loading"><span class="nav-ico">&#10140;</span> Penyiapan</a></li>
          <li><a href="#/opname" data-route="/opname"><span class="nav-ico">&#9745;</span> Stock Opname</a></li>
        </ul>
        <div class="nav-group">Inventory</div>
        <ul>
          <li><a href="#/stock" data-route="/stock"><span class="nav-ico">&#9783;</span> Stock</a></li>
          <li><a href="#/adjustment" data-route="/adjustment"><span class="nav-ico">&#8645;</span> Adjustment</a></li>
        </ul>
      </nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Buka menu">&#9776;</button>
        <span class="topbar-logo"><img src="assets/logo.svg" alt="Logo"></span>
        <span class="app-name">WMS</span>
        <span class="spacer"></span>
        <span class="current-user" id="current-user"></span>
      </header>

      <main class="content">
        <section id="page-dashboard" class="page"></section>
        <section id="page-receiving" class="page"></section>
        <section id="page-stock" class="page"></section>
        <section id="page-loading" class="page"></section>
        <section id="page-opname" class="page"></section>
        <section id="page-adjustment" class="page"></section>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/user.js"></script>
  <script src="js/router.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/receiving.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/opname.js"></script>
  <script src="js/adjustment.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
